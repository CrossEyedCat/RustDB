name: Security Audit

on:
  push:
    branches: [ main, develop ]
  # No `branches` filter: stacked PRs (base = feature branch) must still run security checks.
  pull_request:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  # Dependency vulnerability audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Install outside the repo: `rust-toolchain.toml` pins the MSRV (1.90) and would apply to
      # `cargo install` too, so a tool dependency that raises its own MSRV kills the install and
      # the audit silently stops running (this job failed for days on
      # `kstring 2.0.4 requires rustc 1.96.0`). `--locked` uses cargo-audit's published lockfile.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        working-directory: /tmp

      - name: Run security audit
        run: cargo audit

      # Advisory DB + licenses + banned/unknown sources, from deny.toml.
      - name: Run cargo-deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Dependency license check
  license_check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Same reason as cargo-audit above: keep the MSRV pin out of the tool build.
      - name: Install cargo-license
        run: cargo install cargo-license --locked
        working-directory: /tmp

      - name: Check licenses
        run: cargo license --json > licenses.json

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

  # Unsafe code check
  unsafe_check:
    name: Unsafe Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Install outside the repo so `rust-toolchain.toml` (MSRV 1.90) does not build `cargo-geiger`
      # against 1.90 — latest geiger pulls `cargo` crates that require Rust 1.92+.
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
        working-directory: /tmp

      - name: Check unsafe code usage
        # `rust-toolchain.toml` would pin the scan itself back to the MSRV; geiger needs the
        # newer toolchain it was built against.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cd "${{ github.workspace }}"
          # Run cargo geiger and capture output
          # Use || true to prevent failure on dependency parsing errors
          # These errors occur in dependencies, not our code
          set +e  # Don't exit on error
          cargo geiger --output-format GitHubMarkdown > geiger_full.log 2>&1
          EXIT_CODE=$?
          
          # Filter out known benign warnings and compilation artifacts
          # Keep only the markdown report content
          cat geiger_full.log | \
            grep -v "Failed to match (ignoring source) package" | \
            grep -v "Failed to parse file:" | \
            grep -v "WARNING: Dependency file was never scanned" | \
            grep -v '^\{"\$message_type"' | \
            grep -v "^   Compiling" | \
            grep -v "^   Checking" | \
            grep -v "^    Finished" | \
            grep -v "^     Removed" | \
            grep -v "^error:" > geiger_filtered.log || true
          
          # Write to GitHub step summary. Report the real exit code: an empty filtered log after a
          # non-zero exit means the scan did not run, which must not be rendered as a clean result.
          {
            echo "# Cargo Geiger Report"
            echo ""
            echo "\`cargo geiger\` exit code: \`${EXIT_CODE}\`"
            echo ""
            if [ -s geiger_filtered.log ]; then
              # Show the report, which should contain markdown tables
              cat geiger_filtered.log
            elif [ "$EXIT_CODE" -eq 0 ]; then
              echo "✅ Cargo Geiger scan completed."
              echo ""
              echo "**Note:** Some dependency parsing warnings were filtered as they are benign."
            else
              echo "⚠️ Cargo Geiger produced no report. Raw output:"
              echo ""
              echo '```'
              tail -n 40 geiger_full.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY || true
          
          # Only fail if exit code indicates a real problem (but we've set continue-on-error, so this won't fail the job)
          # Exit code 1 from cargo geiger usually just means warnings, which we've filtered
          exit 0
        continue-on-error: true

  # Static analysis
  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Same as cargo-geiger: avoid MSRV toolchain when compiling the `cargo install` binary.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
        working-directory: /tmp

      - name: Check semver compatibility
        # Without this the run aborts on "rustc version is not high enough: >=1.93.0 needed,
        # got 1.90.0" (`rust-toolchain.toml`), and `continue-on-error` turns the job green
        # without any semver check having happened.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cd "${{ github.workspace }}"
          cargo semver-checks check-release
        # Pre-1.0 crate: breaking changes are expected, so this reports rather than gates.
        continue-on-error: true
